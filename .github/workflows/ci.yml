name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        # No separate `tsc --noEmit` step: Next.js's typed-routes globals
        # (LayoutProps, PageProps, ...) only exist once `next build`/`dev`
        # has generated .next/types, so a standalone tsc pass on a clean
        # checkout fails before that exists. `next build` already runs a
        # full TypeScript check as part of its own pipeline.
        #
        # No Supabase env vars in CI on purpose: only / is statically
        # prerendered, so the build must succeed without them. If it
        # ever starts requiring real credentials, that's a sign a page
        # that should be static/dynamic-safe became a hard dependency.
        run: npm run build

  integration:
    # RLS, auth, realtime and end-to-end browser tests against a real
    # Supabase stack. The bugs that broke production (no session under
    # RLS, a recursive policy, upsert vs RLS, unauthenticated realtime)
    # all live in this layer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (db, auth, rest, realtime)
        run: supabase start -x studio,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - name: Schema file is safe to re-run
        run: |
          psql "$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')" \
            -v ON_ERROR_STOP=1 -q -f supabase/migrations/0001_init.sql

      - name: Integration tests
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" npm run test:integration

      - name: Setup check (supabase/verify.sql) reports all green
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/verify.sql
          failing="$(psql "$DB_URL" -At -F '|' -f supabase/verify.sql | grep '|f|' || true)"
          if [ -n "$failing" ]; then echo "::error::verify.sql failed: $failing"; exit 1; fi

      - name: Build against the local stack
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
