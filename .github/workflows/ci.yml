name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        # No Supabase env vars in CI on purpose: only / is statically
        # prerendered, so the build must succeed without them. If it
        # ever starts requiring real credentials, that's a sign a page
        # that should be static/dynamic-safe became a hard dependency.
        run: npm run build
